[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kh4-demand-intel"
version = "0.2.0"
description = "Behavioural intent classification and demand intelligence for Kingdom Hearts IV community discussion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ghobikan Aravindan" }]
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
]
embeddings = ["sentence-transformers>=2.6"]
transformers = ["transformers>=4.40", "torch>=2.2"]
app = ["streamlit>=1.35,<2"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1",
    "ruff>=0.1.0,<0.16",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["src", "src.ml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
